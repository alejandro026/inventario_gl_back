# ===============================
# Aplicacion
# ===============================
spring.application.name=Inventario
server.port=8080
server.forward-headers-strategy=FRAMEWORK

# ===============================
# DataSource (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL_PROD}
spring.datasource.username=${DB_USER_PROD}
spring.datasource.password=${DB_PASSWORD_PROD}
spring.datasource.driver-class-name=org.postgresql.Driver

#poll
#spring.datasource.hikari.maximum-pool-size=5

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
# Debe definirse mediante la variable de entorno JWT_SECRET (clave HMAC-SHA256 en Base64, minimo 256 bits).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=600000
app.jwt.refresh-expiration-ms=604800000
app.jwt.issuer=papeleria-inventario

# Cookie security settings (false in dev/local, true in prod HTTPS)
app.security.cookie.secure=${LOCAL_MODE}

# CORS Trusted Origins configuration (comma-separated list of allowed origins)
app.security.cors.allowed-origins=${URL_CORS}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.guerrero.Inventario=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%thread] [TraceId: %X{traceId:-}] %-40.40logger{39} : %m%n
